[project]
name = "hermes-retrieval"
version = "0.4.0"
description = "IWE-backed dormant skill and reference retrieval for Hermes and OMP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
authors = [
  { name = "CommanderTurtle" },
]
keywords = ["hermes", "omp", "iwe", "mcp", "retrieval", "skills", "chromadb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "chromadb-client>=1.0,<2",
  "fastembed>=0.7,<1",
  "filelock>=3.20,<4",
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
retrieval = "hermes_retrieval.cli:main"
hermes-retrieval = "hermes_retrieval.cli:main"

[project.urls]
Homepage = "https://github.com/CommanderTurtle/retrieval"
Repository = "https://github.com/CommanderTurtle/retrieval.git"
Issues = "https://github.com/CommanderTurtle/retrieval/issues"

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
