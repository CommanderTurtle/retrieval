[project]
name = "hermes-retrieval"
version = "0.1.0"
description = "Source-aware semantic retrieval for Hermes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb-client>=1.0,<2",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
hermes-retrieval = "hermes_retrieval.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
