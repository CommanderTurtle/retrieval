# Sources are explicit and independently synchronized. Missing optional paths
# are reported as unavailable; they are never discovered by scanning $HOME.

[[sources]]
name = "context-mode"
kind = "context_mode"
path = "~/.codex/context-mode/content"
enabled = false

[[sources]]
name = "hermes-sessions"
kind = "hermes_sessions"
path = "~/.hermes"
enabled = false

[[sources]]
name = "humanizer"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/humanizer"
enabled = true
state = "cold"

[[sources]]
name = "hermes-skills"
kind = "skills"
path = "~/.hermes/skills"
enabled = true
state = "native"
harness = "hermes"

[[sources]]
name = "hermes-archived-skills"
kind = "skills"
path = "~/.hermes/skills/.archive"
enabled = true
state = "archived"
harness = "hermes"

# OMP-native skills with `hide: true` or `disable-model-invocation: true`
# become searchable as `hidden`; advertised native skills remain excluded.
[[sources]]
name = "omp-user-skills"
kind = "skills"
path = "~/.omp/agent/skills"
enabled = true
state = "native"
harness = "omp"

# Explicit OMP custom directories are native sources too. Projection lanes are
# deliberately excluded to prevent a selected copy feeding back into catalog.
[[sources]]
name = "omp-retrieval-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/retrieval/skills"
enabled = true
state = "native"
harness = "omp"

[[sources]]
name = "omp-persephone-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/persephone/skills"
enabled = true
state = "native"
harness = "omp"

# Persistent human-owned intake. Clone any future specialist skill repository
# below this directory; the watcher sees nested SKILL.md changes automatically.
[[sources]]
name = "skill-intake"
kind = "skills"
path = "${RETRIEVAL_SKILL_INTAKE}"
enabled = true
state = "cold"

# Optional long-form material extracted deliberately from AGENTS/RULES files.
# Retrieval indexes one document per Markdown heading. Active context files are
# never mirrored automatically because both harnesses already own them.
[[sources]]
name = "reference-library"
kind = "references"
path = "${RETRIEVAL_REFERENCE_ROOT}"
enabled = false
state = "cold"

[[sources]]
name = "agent-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/agent-skills"
enabled = true
state = "cold"

[[sources]]
name = "agent-workflows"
kind = "workflows"
path = "${HERMES_PROJECTS_DIR}/agent-skills"
enabled = false

[[sources]]
name = "cybersecurity-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/Anthropic-Cybersecurity-Skills"
enabled = true
state = "cold"

[[sources]]
name = "interface-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/make-interfaces-feel-better"
enabled = true
state = "cold"

[[sources]]
name = "hermes-workspace-skills"
kind = "skills"
path = "${HERMES_PROJECTS_DIR}/hermes-workspace/skills"
enabled = true
state = "cold"

[[sources]]
name = "hermes-workspace-workflows"
kind = "workflows"
path = "${HERMES_PROJECTS_DIR}/hermes-workspace"
enabled = false
