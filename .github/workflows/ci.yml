name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen --python 3.13
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build
        run: uv build
